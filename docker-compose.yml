version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unlazynotes-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-unlazynotes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unlazy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unlazynotes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unlazynotes-app
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unlazy-net
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: unlazynotes_postgres_data

networks:
  unlazy-net:
    name: unlazynotes_network
    driver: bridge
